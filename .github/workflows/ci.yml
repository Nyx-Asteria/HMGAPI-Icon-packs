name: Build and test HMGAPI Icon Packs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  mod:
    uses: Open-HMG/HMG-API/.github/workflows/mod.yml@b459567eed0a4c5645efe2deb349b46a3523a422

  download:
    name: Download test package
    needs: mod
    if: ${{ needs.mod.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Add package download to run summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -eu
          artifact_id=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "mod-test-packages" and .expired == false) | .id' | head -n 1)
          if [ -z "$artifact_id" ]; then
            echo "::error::mod-test-packages artifact not found"
            exit 1
          fi
          {
            echo "## 📦 HMGAPI Icon Packs — test package"
            echo ""
            echo "**[Download signed test package]($SERVER_URL/$GH_REPO/actions/runs/$RUN_ID/artifacts/$artifact_id)**"
            echo ""
            echo "This is a CI test build signed with a temporary key, not a permanent release signature."
            echo "The download contains the HMG-API package generated by the upstream build workflow."
          } >> "$GITHUB_STEP_SUMMARY"
