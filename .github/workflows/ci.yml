name: Build HMGAPI Icon Packs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    uses: Open-HMG/HMG-API/.github/workflows/mod.yml@b459567eed0a4c5645efe2deb349b46a3523a422

  publish:
    name: Publish direct test ZIP
    needs: mod
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download SDK-built packages
        uses: actions/download-artifact@v4
        with:
          name: mod-test-packages
          path: packages

      - name: Select installable mod ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("hmgapi-icon-packs/mod.json"))["version"])')
          mapfile -t matches < <(find packages -type f -name "hmgapi-icon-packs-*.zip" ! -iname "*nemesis*" | sort)
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one HMG-API mod ZIP, found ${#matches[@]}"
            find packages -type f -print
            exit 1
          fi
          file="${matches[0]}"
          unzip -Z1 "$file" | grep -qx 'META-HMGAPI/manifest.json'
          unzip -Z1 "$file" | grep -qx 'hooks.jar'
          unzip -Z1 "$file" | grep -qx 'mod.json'
          mkdir -p dist
          cp "$file" "dist/hmgapi-icon-packs-$version.zip"
          echo "file=dist/hmgapi-icon-packs-$version.zip" >> "$GITHUB_OUTPUT"
          echo "tag=testing-$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish direct ZIP as prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILE: ${{ steps.package.outputs.file }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
              --title "$VERSION — experimental test build" --prerelease \
              --notes "Experimental HMG-API mod package, signed with a temporary CI key. Do not treat as a stable author-signed release."
          fi
          echo "### Direct download" >> "$GITHUB_STEP_SUMMARY"
          echo "[$(basename "$FILE")](https://github.com/$GH_REPO/releases/download/$TAG/$(basename "$FILE"))" >> "$GITHUB_STEP_SUMMARY"
          echo "Experimental temporary-key signature; use only for testing." >> "$GITHUB_STEP_SUMMARY"
